<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="300">
  <title>Felix Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 2em; }
    #reading { font-size: 4em; font-weight: bold; }
    #timestamp { color: #666; margin-bottom: 2em; }
    #chart-container { max-width: 900px; margin: 0 auto; }
  </style>
</head>
<body>
  <div id="reading">229 mg/dL</div>
  <div id="timestamp">2026-08-11 22:10 &middot; steady</div>
  <div id="chart-container">
    <canvas id="cgmChart"></canvas>
  </div>

  <script>
    const ctx = document.getElementById('cgmChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ["21:30", "21:30", "21:35", "21:40", "21:45", "21:50", "21:55", "21:55", "21:55", "22:00", "22:05", "22:10"],
        datasets: [{
          label: 'CGM (mg/dL)',
          data: [190, 190, 193, 194, 197, 203, 210, 210, 210, 219, 225, 229],
          borderColor: '#2563eb',
          backgroundColor: 'rgba(37, 99, 235, 0.1)',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2,
          fill: true
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: { min: 40, max: 400 },
          x: {
            ticks: {
              autoSkip: false,
              callback: function(value, index) {
                const label = this.getLabelForValue(value);
                return label.endsWith(':00') ? label.split(':')[0] : '';
              }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
