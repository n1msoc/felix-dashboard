<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="refresh" content="300">
  <title>Felix Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
  <style>
    html { color-scheme: light; }
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 1em;
      background-color: #ffffff;
      color: #111111;
    }
    #reading { font-size: 3em; font-weight: bold; }
    #timestamp { color: #666; margin-bottom: 1em; font-size: 1.1em; }
    #chart-container { max-width: 900px; margin: 0 auto; height: 320px; }
    #tir { margin-top: 1em; font-size: 1.05em; font-weight: 600; color: #333; }
  </style>
</head>
<body>
  <div id="reading">187 mg/dL</div>
  <div id="timestamp">2026-08-12 13:05 &middot; rising</div>
  <div id="chart-container">
    <canvas id="cgmChart"></canvas>
  </div>
  <div id="tir">80.2% Time in Range (70&ndash;180 mg/dL, last 197 readings, 16h 25m)</div>

  <script>
    function segmentColor(value) {
      if (value === null || value === undefined) return undefined;
      if (value < 70) return '#dc2626';
      if (value > 180) return '#eab308';
      return '#16a34a';
    }

    const whiteBackgroundPlugin = {
      id: 'whiteBackground',
      beforeDraw: (chart) => {
        const c = chart.canvas.getContext('2d');
        c.save();
        c.globalCompositeOperation = 'destination-over';
        c.fillStyle = '#ffffff';
        c.fillRect(0, 0, chart.width, chart.height);
        c.restore();
      }
    };

    const ctx = document.getElementById('cgmChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      plugins: [whiteBackgroundPlugin],
      data: {
        labels: ["21:30", "21:30", "21:35", "21:40", "21:45", "21:50", "21:55", "21:55", "21:55", "22:00", "22:05", "22:10", "22:15", "22:20", "22:20", "22:25", "22:25", "22:30", "22:30", "22:35", "22:40", "22:40", "22:45", "22:45", "22:50", "22:50", "22:55", "23:00", "23:05", "23:10", "23:15", "23:20", "23:25", "23:30", "23:35", "23:40", "23:45", "23:50", "23:55", "00:00", "00:05", "00:10", "00:15", "00:20", "00:25", "00:30", "00:35", "00:40", "00:45", "00:50", "00:55", "01:00", "01:05", "01:10", "01:15", "01:20", "01:25", "01:30", "01:35", "01:40", "01:45", "01:50", "01:55", "02:00", "02:05", "02:10", "02:15", "02:20", "02:25", "02:30", "02:35", "02:40", "02:45", "02:50", "02:55", "03:00", "03:05", "03:10", "03:15", "03:20", "03:25", "03:30", "03:35", "03:40", "03:45", "03:50", "03:55", "04:00", "04:05", "04:10", "04:15", "04:20", "04:25", "04:30", "04:35", "04:40", "04:45", "04:50", "04:55", "05:00", "05:05", "05:10", "05:15", "05:20", "05:25", "05:30", "05:35", "05:40", "05:45", "05:50", "05:55", "06:00", "06:05", "06:10", "06:15", "06:20", "06:25", "06:30", "06:35", "06:40", "06:45", "06:50", "06:55", "07:00", "07:05", "07:10", "07:15", "07:20", "07:25", "07:30", "07:35", "07:40", "07:45", "07:50", "07:55", "08:00", "08:05", "08:10", "08:15", "08:20", "08:25", "08:30", "08:35", "08:40", "08:45", "08:50", "08:55", "09:00", "09:05", "09:10", "09:15", "09:20", "09:25", "09:30", "09:35", "09:40", "09:45", "09:50", "09:55", "10:00", "10:05", "10:10", "10:15", "10:20", "10:25", "10:30", "10:35", "10:40", "10:45", "10:50", "10:55", "11:00", "11:05", "11:10", "11:15", "11:20", "11:25", "11:30", "11:35", "11:40", "11:45", "11:50", "11:55", "12:00", "12:05", "12:10", "12:15", "12:20", "12:25", "12:30", "12:35", "12:40", "12:45", "12:50", "12:55", "13:00", "13:05"],
        datasets: [{
          label: 'Dexcom G7 CGM (mg/dl)',
          data: [190, 190, 193, 194, 197, 203, 210, 210, 210, 219, 225, 229, 234, 240, 240, 245, 245, 238, 238, 224, 209, 209, 192, 192, 176, 176, 162, 152, 148, 149, 157, 164, 172, 173, 167, 162, 165, 172, 179, 183, 185, 186, 185, 187, 188, 189, 189, 188, 187, 183, 181, 182, 181, 179, 175, 170, 166, 163, 161, 159, 158, 155, 154, 154, 154, 153, 152, 150, 147, 147, 147, 146, 145, 143, 141, 139, 139, 140, 142, 142, 143, 143, 144, 145, 146, 147, 144, 145, 144, 142, 138, 134, 136, 137, 137, 133, 133, 130, 128, 129, 130, 131, 129, 127, 125, 124, 124, 126, 128, 129, 130, 129, 131, 130, 129, 119, 102, 90, 85, 84, 85, 91, 109, 126, 133, 134, 134, 132, 136, 139, 139, 139, 140, 141, 144, 147, 150, 153, 154, 156, 157, 159, 161, 157, 151, 147, 145, 147, 150, 150, 147, 137, 126, 117, 113, 117, 130, 146, 156, 162, 167, 166, 162, 159, 158, 156, 154, 155, 156, 157, 159, 164, 169, 174, 176, 171, 170, 168, 171, 176, 177, 179, 171, 160, 151, 147, 142, 138, 133, 125, 119, 116, 125, 141, 162, 177, 187],
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2,
          fill: false,
          spanGaps: false,
          segment: {
            borderColor: ctx => segmentColor(ctx.p1.parsed.y)
          }
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            min: 40,
            max: 265,
            grid: { color: 'rgba(0,0,0,0.1)' },
            afterBuildTicks: function(axis) {
              axis.ticks.push({ value: 70 });
              axis.ticks.push({ value: 180 });
              axis.ticks.sort(function(a, b) { return a.value - b.value; });
            },
            ticks: {
              color: '#111111',
              font: function(context) {
                const v = context.tick ? context.tick.value : null;
                return (v === 70 || v === 180)
                  ? { weight: 'bold', size: 13 }
                  : { size: 12 };
              }
            }
          },
          x: {
            grid: { color: 'rgba(0,0,0,0.1)' },
            ticks: {
              color: '#111111',
              autoSkip: false,
              font: { size: 12 },
              callback: function(value, index) {
                const label = this.getLabelForValue(value);
                return label.endsWith(':00') ? label.split(':')[0] : '';
              }
            }
          }
        },
        plugins: {
          legend: {
            labels: {
              boxWidth: 0,
              boxHeight: 0,
              color: '#111111',
              font: { size: 14, weight: 'bold' }
            }
          },
          annotation: {
            annotations: {
              targetRange: {
                type: 'box',
                yMin: 70,
                yMax: 180,
                backgroundColor: 'rgba(20, 83, 45, 0.18)',

</body>
