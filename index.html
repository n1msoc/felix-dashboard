<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="refresh" content="300">
  <title>Felix Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
  <style>
    html { color-scheme: light; }
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 1em;
      background-color: #ffffff;
      color: #111111;
    }
    #reading { font-size: 3em; font-weight: bold; }
    #timestamp { color: #666; margin-bottom: 1em; font-size: 1.1em; }
    #chart-container { max-width: 900px; margin: 0 auto; height: 320px; }
    #tir { margin-top: 1em; font-size: 1.05em; font-weight: 600; color: #333; }
  </style>
</head>
<body>
  <div id="reading">130 mg/dL</div>
  <div id="timestamp">2026-08-12 05:05 &middot; steady</div>
  <div id="chart-container">
    <canvas id="cgmChart"></canvas>
  </div>
  <div id="tir">62.4% Time in Range (70&ndash;180 mg/dL, last 101 readings, 8h 25m)</div>

  <script>
    function segmentColor(value) {
      if (value === null || value === undefined) return undefined;
      if (value < 70) return '#dc2626';
      if (value > 180) return '#eab308';
      return '#16a34a';
    }

    const whiteBackgroundPlugin = {
      id: 'whiteBackground',
      beforeDraw: (chart) => {
        const c = chart.canvas.getContext('2d');
        c.save();
        c.globalCompositeOperation = 'destination-over';
        c.fillStyle = '#ffffff';
        c.fillRect(0, 0, chart.width, chart.height);
        c.restore();
      }
    };

    const ctx = document.getElementById('cgmChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      plugins: [whiteBackgroundPlugin],
      data: {
        labels: ["21:30", "21:30", "21:35", "21:40", "21:45", "21:50", "21:55", "21:55", "21:55", "22:00", "22:05", "22:10", "22:15", "22:20", "22:20", "22:25", "22:25", "22:30", "22:30", "22:35", "22:40", "22:40", "22:45", "22:45", "22:50", "22:50", "22:55", "23:00", "23:05", "23:10", "23:15", "23:20", "23:25", "23:30", "23:35", "23:40", "23:45", "23:50", "23:55", "00:00", "00:05", "00:10", "00:15", "00:20", "00:25", "00:30", "00:35", "00:40", "00:45", "00:50", "00:55", "01:00", "01:05", "01:10", "01:15", "01:20", "01:25", "01:30", "01:35", "01:40", "01:45", "01:50", "01:55", "02:00", "02:05", "02:10", "02:15", "02:20", "02:25", "02:30", "02:35", "02:40", "02:45", "02:50", "02:55", "03:00", "03:05", "03:10", "03:15", "03:20", "03:25", "03:30", "03:35", "03:40", "03:45", "03:50", "03:55", "04:00", "04:05", "04:10", "04:15", "04:20", "04:25", "04:30", "04:35", "04:40", "04:45", "04:50", "04:55", "05:00", "05:05"],
        datasets: [{
          label: 'Dexcom G7 CGM (mg/dl)',
          data: [190, 190, 193, 194, 197, 203, 210, 210, 210, 219, 225, 229, 234, 240, 240, 245, 245, 238, 238, 224, 209, 209, 192, 192, 176, 176, 162, 152, 148, 149, 157, 164, 172, 173, 167, 162, 165, 172, 179, 183, 185, 186, 185, 187, 188, 189, 189, 188, 187, 183, 181, 182, 181, 179, 175, 170, 166, 163, 161, 159, 158, 155, 154, 154, 154, 153, 152, 150, 147, 147, 147, 146, 145, 143, 141, 139, 139, 140, 142, 142, 143, 143, 144, 145, 146, 147, 144, 145, 144, 142, 138, 134, 136, 137, 137, 133, 133, 130, 128, 129, 130],
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2,
          fill: false,
          spanGaps: false,
          segment: {
            borderColor: ctx => segmentColor(ctx.p1.parsed.y)
          }
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            min: 40,
            max: 265,
            grid: { color: 'rgba(0,0,0,0.1)' },
            afterBuildTicks: function(axis) {
              axis.ticks.push({ value: 70 });
              axis.ticks.push({ value: 180 });
              axis.ticks.sort(function(a, b) { return a.value - b.value; });
            },
            ticks: {
              color: '#111111',
              font: function(context) {
                const v = context.tick ? context.tick.value : null;
                return (v === 70 || v === 180)
                  ? { weight: 'bold', size: 13 }
                  : { size: 12 };
              }
            }
          },
          x: {
            grid: { color: 'rgba(0,0,0,0.1)' },
            ticks: {
              color: '#111111',
              autoSkip: false,
              font: { size: 12 },
              callback: function(value, index) {
                const label = this.getLabelForValue(value);
                return label.endsWith(':00') ? label.split(':')[0] : '';
              }
            }
          }
        },
        plugins: {
          legend: {
            labels: {
              boxWidth: 0,
              boxHeight: 0,
              color: '#111111',
              font: { size: 14, weight: 'bold' }
            }
          },
          annotation: {
            annotations: {
              targetRange: {
                type: 'box',
                yMin: 70,
                yMax: 180,
                backgroundColor: 'rgba(20, 83, 45, 0.18)',
                borderWidth: 0
              }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
