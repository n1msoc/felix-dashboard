<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="300">
  <title>Felix Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 2em; }
    #reading { font-size: 4em; font-weight: bold; }
    #timestamp { color: #666; margin-bottom: 2em; font-size: 1.6em; }
    #chart-container { max-width: 900px; margin: 0 auto; }
    #tir { margin-top: 1.5em; font-size: 1.3em; font-weight: 600; color: #333; }
  </style>
</head>
<body>
  <div id="reading">209 mg/dL</div>
  <div id="timestamp">2026-08-11 22:40 &middot; falling slightly</div>
  <div id="chart-container">
    <canvas id="cgmChart"></canvas>
  </div>
  <div id="tir">0.0% Time in Range (70&ndash;180 mg/dL, last 21 readings, 1h 45m)</div>

  <script>
    function segmentColor(value) {
      if (value === null || value === undefined) return undefined;
      if (value < 70) return '#dc2626';
      if (value > 180) return '#eab308';
      return '#16a34a';
    }

    const ctx = document.getElementById('cgmChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ["21:30", "21:30", "21:35", "21:40", "21:45", "21:50", "21:55", "21:55", "21:55", "22:00", "22:05", "22:10", "22:15", "22:20", "22:20", "22:25", "22:25", "22:30", "22:30", "22:35", "22:40"],
        datasets: [{
          label: 'Dexcom G7 CGM (mg/dl)',
          data: [190, 190, 193, 194, 197, 203, 210, 210, 210, 219, 225, 229, 234, 240, 240, 245, 245, 238, 238, 224, 209],
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2,
          fill: false,
          spanGaps: false,
          segment: {
            borderColor: ctx => segmentColor(ctx.p1.parsed.y)
          }
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            min: 40,
            max: 265,
            afterBuildTicks: function(axis) {
              axis.ticks.push({ value: 70 });
              axis.ticks.push({ value: 180 });
              axis.ticks.sort(function(a, b) { return a.value - b.value; });
            },
            ticks: {
              font: function(context) {
                const v = context.tick ? context.tick.value : null;
                return (v === 70 || v === 180)
                  ? { weight: 'bold', size: 18 }
                  : { size: 16 };
              }
            }
          },
          x: {
            ticks: {
              autoSkip: false,
              font: { size: 16 },
              callback: function(value, index) {
                const label = this.getLabelForValue(value);
                return label.endsWith(':00') ? label.split(':')[0] : '';
              }
            }
          }
        },
        plugins: {
          legend: {
            labels: {
              boxWidth: 0,
              boxHeight: 0,
              font: { size: 18, weight: 'bold' }
            }
          },
          annotation: {
            annotations: {
              targetRange: {
                type: 'box',
                yMin: 70,
                yMax: 180,
                backgroundColor: 'rgba(20, 83, 45, 0.1)',
                borderWidth: 0
              }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
